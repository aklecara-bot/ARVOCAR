<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ARVO - Reservas Mobile</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header Fixo -->
  <header class="bg-brand-900 text-white sticky top-0 z-40 shadow-md">
    <div class="px-4 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="bg-brand-600 p-1.5 rounded-lg text-white">
          <i class="ph-bold ph-calendar-check text-lg"></i>
        </div>
        <div>
          <h1 class="text-sm font-black tracking-tight leading-none">ARVO Reservas</h1>
          <span id="m-user-label" class="text-[10px] text-brand-300 font-semibold block leading-tight truncate max-w-[190px]">Condutor</span>
        </div>
      </div>

      <button onclick="handleMobileLogout()" title="Sair" class="text-xs bg-brand-800 hover:bg-rose-600 text-white px-2.5 py-1.5 rounded-lg border border-brand-700 transition flex items-center gap-1">
          <i class="ph-bold ph-sign-out text-sm"></i>
          <span class="font-bold">Sair</span>
        </button>
      </a>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 p-4 pb-24 max-w-md mx-auto w-full space-y-4">

    <!-- Card de Agendamento -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
      <div class="flex items-center gap-2.5 pb-3 border-b border-slate-100">
        <div class="p-2 bg-brand-50 text-brand-700 rounded-xl">
          <i class="ph-bold ph-calendar-plus text-lg"></i>
        </div>
        <div>
          <h2 class="text-sm font-bold text-slate-900">Novo Agendamento</h2>
          <p class="text-[11px] text-slate-400">Garanta o carro para sua atividade</p>
        </div>
      </div>

      <form id="formReservaMobile" onsubmit="handleSalvarReservaMobile(event)" class="space-y-3.5 text-xs">
        
        <!-- Seleção de Veículo -->
        <div>
          <label class="block font-bold text-slate-700 uppercase mb-1">Veículo</label>
          <select id="m-res-veiculo" onchange="atualizarKmVeiculoMobile()" " required class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl px-3 py-2.5 font-bold focus:ring-2 focus:ring-brand-500">
            <option value="">Selecione o veículo...</option>
          </select>
        </div>

        <!-- Modalidade da Reserva -->
        <div>
          <label class="block font-bold text-slate-700 uppercase mb-1">Modalidade</label>
          <select id="m-res-tipo" onchange="ajustarCamposModalidadeMobile(this.value)" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl px-3 py-2.5 font-semibold focus:ring-2 focus:ring-brand-500">
            <option value="HORAS">Por Horas (Mesmo dia)</option>
            <option value="TURNO">Por Turno (Manhã, Tarde ou Noite)</option>
            <option value="DIAS" selected>Por Dia / Dias</option>
            <option value="SEMANAS">Por Semana(s)</option>
            <option value="MES">Por Mês</option>
          </select>
        </div>

        <!-- Campos de Horas (Exibidos se tipo = HORAS) -->
        <div id="box-horas-mobile" class="hidden grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-slate-600 mb-1">Hora Início</label>
            <input type="time" id="m-res-hora-inicio" value="08:00" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-2 font-mono" />
          </div>
          <div>
            <label class="block font-bold text-slate-600 mb-1">Hora Fim</label>
            <input type="time" id="m-res-hora-fim" value="12:00" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-2 font-mono" />
          </div>
        </div>

        <!-- Campos de Turno (Exibidos se tipo = TURNO) -->
        <div id="box-turno-mobile" class="hidden">
          <label class="block font-bold text-slate-600 mb-1">Turno Desejado</label>
          <select id="m-res-turno-sel" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2">
            <option value="MANHA">Manhã (07:00 às 12:00)</option>
            <option value="TARDE">Tarde (13:00 às 18:00)</option>
            <option value="NOITE">Noite / Integral (18:00 às 06:00)</option>
          </select>
        </div>

        <!-- Datas -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-slate-700 uppercase mb-1">Data Início</label>
            <input type="date" id="m-res-data-inicio" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl px-2.5 py-2 font-medium focus:ring-2 focus:ring-brand-500" />
          </div>
          <div id="box-data-fim-mobile">
            <label class="block font-bold text-slate-700 uppercase mb-1">Data Fim</label>
            <input type="date" id="m-res-data-fim" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl px-2.5 py-2 font-medium focus:ring-2 focus:ring-brand-500" />
          </div>
        </div>

        <!-- Finalidade -->
        <div>
          <label class="block font-bold text-slate-700 uppercase mb-1">Finalidade / Projeto</label>
          <select id="m-res-finalidade" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl px-3 py-2 font-medium focus:ring-2 focus:ring-brand-500">
            <option value="MONITORAMENTO">MONITORAMENTO</option>
            <option value="PROJETO TÉCNICO E MONITORAMENTO">PROJETO TÉCNICO E MONITORAMENTO</option>
            <option value="PREPARAÇÃO E MONITORAMENTO">PREPARAÇÃO E MONITORAMENTO</option>
            <option value="REFLORESTAR">REFLORESTAR</option>
            <option value="GESTÁGUA">GESTÁGUA</option>
            <option value="DEMANDAS INTERNAS">DEMANDAS INTERNAS</option>
          </select>
        </div>

        <div>
          <label class="block font-bold text-slate-700 uppercase mb-1">Observações</label>
          <textarea id="m-res-obs" rows="2" placeholder="Observações..." class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-brand-500"></textarea>
        </div>

        <button type="submit" id="btn-m-salvar-res" class="w-full bg-brand-700 hover:bg-brand-800 text-white font-bold py-3 px-4 rounded-xl shadow transition flex items-center justify-center gap-2 text-xs">
          <i class="ph-bold ph-check"></i> Confirmar Agendamento
        </button>
      </form>
    </div>

    <!-- Lista de Reservas Confirmadas -->
    <div class="space-y-2.5">
      <div class="flex items-center justify-between px-1">
        <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Agendamentos Ativos</h3>
        <span id="m-badge-reservas" class="text-[11px] bg-brand-100 text-brand-800 font-bold px-2 py-0.5 rounded-full">0 reservas</span>
      </div>

      <div id="m-lista-reservas" class="space-y-2.5">
        <!-- Cards gerados dinamicamente via JS -->
      </div>
    </div>

  </main>

  <!-- Barra de Navegação Inferior -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-2 flex justify-around items-center z-40 shadow-lg pb-safe">
    <a href="mobile.html" class="flex flex-col items-center gap-1 text-slate-400 font-semibold hover:text-brand-700 transition">
      <i class="ph-bold ph-key text-xl"></i>
      <span class="text-[10px]">Iniciar</span>
    </a>

    <a href="mobile.html" class="flex flex-col items-center gap-1 text-slate-400 font-semibold hover:text-brand-700 transition">
      <i class="ph-bold ph-map-pin-line text-xl"></i>
      <span class="text-[10px]">Finalizar</span>
    </a>

    <a href="mobile.html" class="flex flex-col items-center gap-1 text-slate-400 font-semibold hover:text-brand-700 transition">
      <i class="ph-bold ph-clock-counter-clockwise text-xl"></i>
      <span class="text-[10px]">Rotas</span>
    </a>

    <div class="flex flex-col items-center gap-1 text-brand-700 font-bold transition">
      <i class="ph-bold ph-calendar-check text-xl"></i>
      <span class="text-[10px]">Reservas</span>
    </div>
    <a href="/arvocar-mobile/FR-ontendMobile/abastecimentoMobile.html" id="nav-btn-abastecimento" class="flex flex-col items-center gap-1 text-slate-400 font-semibold transition">
    <i class="ph-bold ph-gas-pump text-xl"></i>
    <span class="text-[10px]">Abastecimento</span>
    </a>

  </nav>

  <script src="/arvocar-mobile/BA-ckendMobile/mobile.js"></script>
</body>
</html>
