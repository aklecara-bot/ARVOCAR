<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ARVOCAR - Abastecimento</title>

  <!-- PWA & Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="/imagens/logo3d192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/imagens/logo3d192.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Bibliotecas Externas -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Folha de Estilos Centralizada -->
  <link rel="stylesheet" href="/EsTyle/style.css" />
  <link rel="stylesheet" href="../../EStyle/style.css" />
  <link rel="stylesheet" href="../../EsTyle/style.css" />
</head>

<body class="app-body">

  <!-- Header Superior Verde Escuro -->
  <header class="app-header">
    <div class="max-w-md mx-auto px-4 py-2.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="brand-badge-logo" style="width: 2.25rem; height: 2.25rem; padding: 0.25rem;">
          <i class="ph-bold ph-gas-pump text-xl text-brand-100"></i>
        </div>
        <div>
          <h1 class="brand-title text-sm">Abastecimento</h1>
          <p id="user-display" class="text-[11px] text-brand-300 leading-tight">Carregando...</p>
        </div>
      </div>
      <button onclick="handleMobileLogout()" title="Sair" class="btn-logout">
        <i class="ph-bold ph-sign-out text-sm"></i>
        <span>Sair</span>
      </button>
    </div>

    <!-- Navegação em Abas Superiores -->
    <div class="mobile-subtabs-bar mobile-subtabs-header">
      <button id="tab-btn-novo" onclick="trocarAba('novo')" class="mobile-subtab-btn mobile-subtab-btn-active" style="color: #fde047 !important; border-bottom-color: #fde047 !important;">
        <i class="ph-bold ph-plus-circle text-base"></i>
        <span>Novo Registro</span>
      </button>
      <button id="tab-btn-historico" onclick="trocarAba('historico')" class="mobile-subtab-btn mobile-subtab-btn-inactive" style="color: rgba(255,255,255,0.6) !important;">
        <i class="ph-bold ph-clock-counter-clockwise text-base"></i>
        <span>Histórico</span>
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="mobile-content">

    <!-- ABA 1: FORMULÁRIO DE ABASTECIMENTO -->
    <section id="view-novo" class="space-y-4">
      <div class="card-panel">
        <form id="form-abastecimento" onsubmit="salvarAbastecimentoMobile(event)" class="space-y-3.5">

          <div class="form-group">
            <label class="form-label">Veículo *</label>
            <div class="relative">
              <span class="absolute left-3 top-2.5 text-slate-400"><i class="ph-bold ph-car text-base"></i></span>
              <select id="abs-veiculo" required class="form-control" style="padding-left: 2.25rem;">
                <option value="">Selecione o veículo...</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Posto / Local *</label>
            <div class="relative">
              <span class="absolute left-3 top-2.5 text-slate-400"><i class="ph-bold ph-storefront text-base"></i></span>
              <input type="text" id="abs-posto" required placeholder="Ex: Posto Ipiranga Centro" class="form-control" style="padding-left: 2.25rem;">
            </div>
          </div>

          <div class="form-grid-2 form-group">
            <div>
              <label class="form-label">Combustível</label>
              <select id="abs-tipo" class="form-control">
                <option value="Gasolina Comum">Gasolina Comum</option>
                <option value="Gasolina Aditivada">Gasolina Adit.</option>
                <option value="Etanol">Etanol</option>
                <option value="Diesel S10">Diesel S10</option>
                <option value="GNV">GNV</option>
              </select>
            </div>
            <div>
              <label class="form-label">Km Hodômetro *</label>
              <input type="number" id="abs-km" required placeholder="Ex: 45230" class="form-control font-mono">
            </div>
          </div>

          <div class="form-grid-2 form-group">
            <div>
              <label class="form-label">Litros (L) *</label>
              <input type="number" step="0.01" id="abs-litros" required oninput="calcularTotal()" placeholder="0.00" class="form-control font-mono">
            </div>
            <div>
              <label class="form-label">Preço / Litro (R$) *</label>
              <input type="number" step="0.01" id="abs-preco-litro" required oninput="calcularTotal()" placeholder="0.00" class="form-control font-mono">
            </div>
          </div>

          <div class="p-3 bg-amber-50 border border-amber-200/70 rounded-xl flex items-center justify-between">
            <span class="text-xs text-amber-900 font-medium">Valor Total Previsto:</span>
            <span id="display-total" class="text-base font-bold text-amber-700 font-mono">R$ 0,00</span>
          </div>

          <div class="form-group">
            <label class="form-label">Foto do Cupom / Comprovante</label>
            <div class="flex items-center gap-2">
              <label class="flex-1 cursor-pointer bg-slate-50 border border-dashed border-slate-300 rounded-xl p-3 text-center hover:bg-slate-100 transition flex flex-col items-center justify-center gap-1">
                <i class="ph-bold ph-camera text-xl text-slate-500"></i>
                <span id="comprovante-nome" class="text-[11px] text-slate-600 font-medium">Tirar foto ou anexar arquivo</span>
                <input type="file" id="abs-foto" accept="image/*" capture="environment" onchange="atualizarNomeArquivo(this)" class="hidden">
              </label>
            </div>
          </div>

          <button type="submit" id="btn-submit" class="btn-primary">
            <i class="ph-bold ph-check"></i>
            <span>Registrar Abastecimento</span>
          </button>
        </form>
      </div>
    </section>

    <!-- ABA 2: HISTÓRICO DE LANÇAMENTOS -->
    <section id="view-historico" class="hidden space-y-3">
      <div class="flex items-center justify-between px-1">
        <h2 class="form-label mb-0">Lançamentos Recentes</h2>
        <button type="button" onclick="carregarHistoricoAbastecimento()" class="text-xs text-brand-700 hover:underline flex items-center gap-1 font-bold">
          <i class="ph-bold ph-arrows-clockwise"></i> Atualizar
        </button>
      </div>

      <div id="lista-abastecimentos" class="space-y-2.5">
        <!-- Cards gerados via JS -->
      </div>
    </section>

    <!-- MODAL DE DETALHES E COMPROVANTE -->
    <div id="modal-detalhes-abast" class="hidden modal-backdrop">
      <div class="modal-card max-h-[90vh] overflow-y-auto space-y-4">
        
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
          <div class="flex items-center gap-2">
            <div class="p-2 bg-amber-50 text-amber-600 rounded-xl">
              <i class="ph-bold ph-receipt text-lg"></i>
            </div>
            <h3 class="text-sm font-black text-slate-800" id="modal-abast-veiculo">Detalhes do Abastecimento</h3>
          </div>
          <button type="button" onclick="fecharModalAbastecimento()" class="btn-logout" style="background: transparent; border: none; color: #64748b;">
            <i class="ph-bold ph-x text-lg"></i>
          </button>
        </div>

        <!-- Informações Detalhadas -->
        <div class="info-summary-box space-y-2 text-xs">
          <div class="info-summary-row"><span class="text-slate-500 font-medium">Posto:</span> <b id="modal-abast-posto" class="text-slate-800 text-right">-</b></div>
          <div class="info-summary-row"><span class="text-slate-500 font-medium">Combustível:</span> <b id="modal-abast-tipo" class="text-slate-800">-</b></div>
          <div class="info-summary-row"><span class="text-slate-500 font-medium">Responsável:</span> <b id="modal-abast-resp" class="text-slate-800">-</b></div>
          <div class="info-summary-row"><span class="text-slate-500 font-medium">Odômetro (KM):</span> <b id="modal-abast-km" class="text-slate-800 font-mono">-</b></div>
          <div class="info-summary-row"><span class="text-slate-500 font-medium">Litros / Preço:</span> <b id="modal-abast-litros-preco" class="text-slate-800 font-mono">-</b></div>
          <div class="info-summary-row pt-1.5 border-t border-slate-200/60"><span class="text-emerald-800 font-bold">Valor Total:</span> <b id="modal-abast-total" class="text-emerald-700 font-mono font-bold text-sm">-</b></div>
          <div class="info-summary-row"><span class="text-slate-400 text-[10px]">Data e Hora:</span> <span id="modal-abast-data" class="text-slate-500 text-[10px] font-mono">-</span></div>
        </div>

        <!-- Área da Imagem / Download -->
        <div id="modal-box-comprovante" class="space-y-3">
          <div class="rounded-xl overflow-hidden border border-slate-200 bg-slate-100 max-h-56 flex items-center justify-center p-1">
            <img id="modal-img-preview" src="" alt="Cupom Fiscal" class="w-full h-auto object-contain max-h-52 rounded-lg" />
          </div>
          <div class="flex gap-2">
            <a id="btn-ver-imagem" href="#" target="_blank" class="flex-1 text-center bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-1.5">
              <i class="ph-bold ph-arrow-square-out text-base"></i> Abrir Imagem
            </a>
            <button type="button" id="btn-baixar-imagem" onclick="baixarImagemComprovante()" class="flex-1 btn-header-amber font-bold text-xs py-2.5 rounded-xl transition flex items-center justify-center gap-1.5">
              <i class="ph-bold ph-download-simple text-base"></i> Baixar Arquivo
            </button>
          </div>
        </div>

        <div id="modal-sem-comprovante" class="hidden text-center py-4 text-xs text-slate-400 italic bg-slate-50 rounded-2xl border border-slate-100">
          Nenhum comprovante fiscal anexado neste registro.
        </div>
      </div>
    </div>

  </main>

  <!-- Barra de Navegação Inferior (Redirecionamento correto com parâmetros) -->
  <nav class="mobile-bottom-nav">
    <button type="button" onclick="switchMobileTab('iniciar')" id="nav-btn-iniciar" class="mobile-nav-item mobile-nav-item-inactive">
      <i class="ph-bold ph-key text-xl"></i>
      <span>Iniciar</span>
    </button>

    <button type="button" onclick="switchMobileTab('finalizar')" id="nav-btn-finalizar" class="mobile-nav-item mobile-nav-item-inactive">
      <i class="ph-bold ph-map-pin-line text-xl"></i>
      <span>Finalizar</span>
    </button>

    <button type="button" onclick="switchMobileTab('historico')" id="nav-btn-historico" class="mobile-nav-item mobile-nav-item-inactive">
      <i class="ph-bold ph-clock-counter-clockwise text-xl"></i>
      <span>Rotas</span>
    </button>

    <a href="reservasmobile.html" id="nav-btn-reservas" class="mobile-nav-item mobile-nav-item-inactive">
      <i class="ph-bold ph-calendar-check text-xl"></i>
      <span>Reservas</span>
    </a>

    <a href="abastecimentomobile.html" id="nav-btn-abastecimento" class="mobile-nav-item mobile-nav-item-active">
      <i class="ph-bold ph-gas-pump text-xl"></i>
      <span>Abastecer</span>
    </a>
  </nav>

  <!-- Script relativo seguro -->
  <script src="../backendmobile/abastecimentomobile.js"></script>
</body>

</html>
