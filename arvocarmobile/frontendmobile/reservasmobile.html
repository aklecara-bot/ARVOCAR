<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ARVOCAR - Reservas</title>

  <!-- Tailwind CSS & Phosphor Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
    .fc .fc-toolbar-title { font-size: 0.9rem !important; font-weight: 800 !important; color: #1e293b; }
    .fc .fc-button { font-size: 0.65rem !important; padding: 0.25rem 0.5rem !important; font-weight: 700 !important; border-radius: 0.5rem !important; }
    .fc .fc-button-primary { background-color: #15803d !important; border-color: #15803d !important; }
    .fc .fc-daygrid-day-number { font-size: 0.75rem !important; font-weight: 600; }
    .fc-event { font-size: 0.65rem !important; border-radius: 4px !important; padding: 1px 3px !important; cursor: pointer; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-24 antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header Superior Verde Escuro com Abas (Padrão Abastecimento) -->
  <header class="bg-brand-900 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-brand-800 flex items-center justify-center border border-brand-700 shadow-inner">
          <i class="ph-bold ph-calendar-check text-xl text-brand-100"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold leading-tight">Reservas</h1>
          <p id="user-display" class="text-[11px] text-slate-400">Carregando...</p>
        </div>
      </div>
      <button onclick="handleMobileLogout()" title="Sair" class="text-xs bg-brand-800/80 hover:bg-rose-700 text-brand-100 px-3 py-1.5 rounded-xl border border-brand-700 transition flex items-center gap-1 active:scale-95">
          <i class="ph-bold ph-sign-out text-sm"></i>
          <span class="font-bold">Sair</span>
        </button>
    </div>

    <!-- Navegação em Abas Superiores -->
    <div class="max-w-md mx-auto px-4 flex border-t border-slate-800 text-xs">
      <button id="tab-btn-novo" onclick="trocarAba('novo')" class="flex-1 py-2.5 text-center font-bold text-amber-400 border-b-2 border-amber-400 flex items-center justify-center gap-1.5 transition">
        <i class="ph-bold ph-plus-circle"></i> Novo Agendamento
      </button>
      <button id="tab-btn-calendario" onclick="trocarAba('calendario')" class="flex-1 py-2.5 text-center font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent flex items-center justify-center gap-1.5 transition">
        <i class="ph-bold ph-calendar"></i> Calendário & Lista
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-md mx-auto p-4">

    <!-- ========================================== -->
    <!-- ABA 1: FORMULÁRIO DE NOVO AGENDAMENTO      -->
    <!-- ========================================== -->
    <section id="view-novo" class="space-y-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <form id="form-reserva" onsubmit="salvarReservaMobile(event)" class="space-y-3.5">
          
          <!-- Veículo -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Veículo *</label>
            <div class="relative">
              <span class="absolute left-3 top-2.5 text-slate-400"><i class="ph-bold ph-car text-base"></i></span>
              <select id="res-veiculo" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 outline-none">
                <option value="">Carregando veículos...</option>
              </select>
            </div>
          </div>

          <!-- Modalidade da Reserva -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Modalidade da Reserva *</label>
            <div class="relative">
              <span class="absolute left-3 top-2.5 text-slate-400"><i class="ph-bold ph-clock text-base"></i></span>
              <select id="res-tipo" onchange="ajustarCamposModalidade(this.value)" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 outline-none">
                <option value="HORAS">Por Horas (Mesmo dia)</option>
                <option value="TURNO">Por Turno (Manhã, Tarde ou Noite)</option>
                <option value="DIAS" selected>Por Dia / Dias</option>
                <option value="SEMANAS">Por Semana(s)</option>
                <option value="MES">Por Mês</option>
              </select>
            </div>
          </div>

          <!-- Campos de Horas (Se modalidade = HORAS) -->
          <div id="box-horas" class="hidden grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Hora Início</label>
              <input type="time" id="res-hora-inicio" value="08:00" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 outline-none font-mono">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Hora Fim</label>
              <input type="time" id="res-hora-fim" value="12:00" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 outline-none font-mono">
            </div>
          </div>

          <!-- Campos de Turno (Se modalidade = TURNO) -->
          <div id="box-turno" class="hidden">
            <label class="block text-xs font-semibold text-slate-700 mb-1">Turno Desejado</label>
            <select id="res-turno-sel" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 outline-none">
              <option value="MANHA">Manhã (07:00 às 12:00)</option>
              <option value="TARDE">Tarde (13:00 às 18:00)</option>
              <option value="NOITE">Noite / Integral (18:00 às 06:00)</option>
            </select>
          </div>

          <!-- Datas -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Data Início *</label>
              <input type="date" id="res-data-inicio" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div id="box-data-fim">
              <label class="block text-xs font-semibold text-slate-700 mb-1">Data Fim *</label>
              <input type="date" id="res-data-fim" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
          </div>

          <!-- Finalidade / Projeto -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Finalidade / Projeto *</label>
            <div class="relative">
              <span class="absolute left-3 top-2.5 text-slate-400"><i class="ph-bold ph-briefcase text-base"></i></span>
              <select id="res-finalidade" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 outline-none">
                <option value="MONITORAMENTO">MONITORAMENTO</option>
                <option value="PROJETO TÉCNICO E MONITORAMENTO">PROJETO TÉCNICO E MONITORAMENTO</option>
                <option value="PREPARAÇÃO E MONITORAMENTO">PREPARAÇÃO E MONITORAMENTO</option>
                <option value="REFLORESTAR">REFLORESTAR</option>
                <option value="GESTÁGUA">GESTÁGUA</option>
                <option value="DEMANDAS INTERNAS">DEMANDAS INTERNAS</option>
              </select>
            </div>
          </div>

          <!-- Observações -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Observações (Opcional)</label>
            <textarea id="res-obs" rows="2" placeholder="Ex: Viagem para Anutiba..." class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-brand-500 outline-none"></textarea>
          </div>

          <!-- Botão Salvar -->
          <button type="submit" id="btn-submit" class="w-full bg-brand-700 hover:bg-brand-800 text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm mt-2">
            <i class="ph-bold ph-check"></i>
            <span>Confirmar Agendamento</span>
          </button>
        </form>
      </div>
    </section>

    <!-- ========================================== -->
    <!-- ABA 2: CALENDÁRIO & PRÓXIMOS AGENDAMENTOS  -->
    <!-- ========================================== -->
    <section id="view-calendario" class="hidden space-y-4">
      
      <!-- Card do Calendário -->
      <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200">
        <div id="calendar" class="min-h-[340px]"></div>
      </div>

      <!-- Lista de Agendamentos Ativos -->
      <div class="space-y-2.5">
        <div class="flex items-center justify-between px-1">
          <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Próximos Agendamentos</h2>
          <span id="badge-total-reservas" class="text-[11px] bg-brand-50 text-brand-700 border border-brand-200 font-bold px-2 py-0.5 rounded-full">0 reservas</span>
        </div>

        <div id="lista-reservas" class="space-y-2.5">
          <!-- Renderizado via JavaScript -->
        </div>
      </div>

    </section>

  </main>

  <!-- Barra de Navegação Inferior (Estrutura idêntica à de Abastecimento) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 flex justify-around items-center z-40 shadow-lg pb-safe">
    <a href="mobile.html" class="flex flex-col items-center gap-1 text-slate-400 font-semibold hover:text-brand-700 transition">
      <i class="ph-bold ph-key text-xl"></i>
      <span class="text-[10px]">Iniciar</span>
    </a>

    <a href="mobile.html" class="flex flex-col items-center gap-1 text-slate-400 font-semibold hover:text-brand-700 transition">
      <i class="ph-bold ph-map-pin-line text-xl"></i>
      <span class="text-[10px]">Finalizar</span>
    </a>

    <a href="mobile.html" class="flex flex-col items-center gap-1 text-slate-400 font-semibold hover:text-brand-700 transition">
      <i class="ph-bold ph-clock-counter-clockwise text-xl"></i>
      <span class="text-[10px]">Rotas</span>
    </a>

    <a href="reservasmobile.html" id="nav-btn-reservas" class="flex flex-col items-center gap-1 text-brand-700 font-bold transition">
      <i class="ph-bold ph-calendar-check text-xl"></i>
      <span class="text-[10px]">Reservas</span>
    </a>

    <a href="abastecimentomobile.html" id="nav-btn-abastecimento" class="flex flex-col items-center gap-1 text-slate-400 font-semibold hover:text-brand-700 transition">
      <i class="ph-bold ph-gas-pump text-xl"></i>
      <span class="text-[10px]">Abastecimento</span>
    </a>
  </nav>

  <!-- Script Externo -->
  <script src="reservasmobile.js"></script>
</body>
</html>
