<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="192x192" href="/imagens/logo3d192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/imagens/logo3d192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="/EsTyle/style.css">
  <title>ARVOCAR - Reservas</title>

  <!-- Tailwind CSS & Phosphor Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
    .fc .fc-toolbar-title { font-size: 0.9rem !important; font-weight: 800 !important; color: #1e293b; }
    .fc .fc-button { font-size: 0.65rem !important; padding: 0.25rem 0.5rem !important; font-weight: 700 !important; border-radius: 0.5rem !important; }
    .fc .fc-button-primary { background-color: #15803d !important; border-color: #15803d !important; }
    .fc .fc-daygrid-day-number { font-size: 0.75rem !important; font-weight: 600; }
    .fc-event { font-size: 0.65rem !important; border-radius: 4px !important; padding: 1px 3px !important; cursor: pointer; }
  </style>
</head>
<body class="app-body">

  <!-- Header Superior Verde Escuro com Abas (Padrão Abastecimento) -->
  <header class="app-header">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="brand-badge-logo" style="width: 2.25rem; height: 2.25rem; padding: 0.25rem;">
          <i class="ph-bold ph-calendar-check text-xl"></i>
        </div>
        <div>
          <h1 class="brand-title text-sm">Reservas</h1>
          <p id="user-display" class="text-[11px] text-slate-400">Carregando...</p>
        </div>
      </div>
      <button onclick="handleMobileLogout()" title="Sair" class="btn-logout">
          <i class="ph-bold ph-sign-out text-sm"></i>
          <span>Sair</span>
        </button>
    </div>

    <!-- Navegação em Abas Superiores -->
    <div class="mobile-subtabs-bar mobile-subtabs-header">
      <button id="tab-btn-novo" onclick="trocarAba('novo')" class="mobile-subtab-btn mobile-subtab-btn-active" style="color: #fde047 !important; border-bottom-color: #fde047 !important;">
        <i class="ph-bold ph-plus-circle text-base"></i> <span>Novo Agendamento</span>
      </button>
      <button id="tab-btn-calendario" onclick="trocarAba('calendario')" class="mobile-subtab-btn mobile-subtab-btn-inactive" style="color: rgba(255,255,255,0.6) !important;">
        <i class="ph-bold ph-calendar text-base"></i> <span>Calendário & Lista</span>
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="mobile-content">

    <!-- ABA 1: FORMULÁRIO DE NOVO AGENDAMENTO -->

    <section id="view-novo" class="space-y-4">
      <div class="card-panel">
        <form id="form-reserva" onsubmit="salvarReservaMobile(event)" class="space-y-3.5">
          
          <!-- Veículo -->
          <div class="form-group">
            <label class="form-label">Veículo *</label>
            <div class="relative">
              <span class="absolute left-3 top-2.5 text-slate-400"><i class="ph-bold ph-car text-base"></i></span>
              <select id="res-veiculo" required class="form-control" style="padding-left: 2.25rem;">
                <option value="">Carregando veículos...</option>
              </select>
            </div>
          </div>

          <!-- Modalidade da Reserva -->
          <div class="form-group">
            <label class="form-label">Modalidade da Reserva *</label>
            <div class="relative">
              <span class="absolute left-3 top-2.5 text-slate-400"><i class="ph-bold ph-clock text-base"></i></span>
              <select id="res-tipo" onchange="ajustarCamposModalidade(this.value)" required class="form-control" style="padding-left: 2.25rem;">
                <option value="HORAS">Por Horas (Mesmo dia)</option>
                <option value="TURNO">Por Turno (Manhã, Tarde ou Noite)</option>
                <option value="DIAS" selected>Por Dia / Dias</option>
                <option value="SEMANAS">Por Semana(s)</option>
                <option value="MES">Por Mês</option>
              </select>
            </div>
          </div>

          <!-- Campos de Horas (Se modalidade = HORAS) -->
          <div id="box-horas" class="hidden grid grid-cols-2 gap-3">
            <div>
              <label class="form-label">Hora Início</label>
              <input type="time" id="res-hora-inicio" value="08:00" class="form-control font-mono">
            </div>
            <div>
              <label class="form-label">Hora Fim</label>
              <input type="time" id="res-hora-fim" value="12:00" class="form-control font-mono">
            </div>
          </div>

          <!-- Campos de Turno (Se modalidade = TURNO) -->
          <div id="box-turno" class="hidden form-group">
            <label class="form-label">Turno Desejado</label>
            <select id="res-turno-sel" class="form-control">
              <option value="MANHA">Manhã (07:00 às 12:00)</option>
              <option value="TARDE">Tarde (13:00 às 18:00)</option>
              <option value="NOITE">Noite / Integral (18:00 às 06:00)</option>
            </select>
          </div>

          <!-- Datas -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="form-label">Data Início *</label>
              <input type="date" id="res-data-inicio" required class="form-control">
            </div>
            <div id="box-data-fim">
              <label class="form-label">Data Fim *</label>
              <input type="date" id="res-data-fim" required class="form-control">
            </div>
          </div>

          <!-- Finalidade / Projeto -->
          <div class="form-group">
            <label class="form-label">Finalidade / Projeto *</label>
            <div class="relative">
              <span class="absolute left-3 top-2.5 text-slate-400"><i class="ph-bold ph-briefcase text-base"></i></span>
              <select id="res-finalidade" required class="form-control">
                <option value="">...</option>          
                <option value="CO INVESTIMENTO WWF">CO INVESTIMENTO WWF</option>
                <option value="DEMANDAS INTERNAS">DEMANDAS INTERNAS</option>
                <option value="DEMANDAS EXTERNAS">DEMANDAS EXTERNAS</option>
                <option value="IMPLANTACAO DE AREAS">IMPLANTAÇÃO DE ÁREAS</option>
                <option value="REFLORESTAR">REFLORESTAR</option>
                <option value="RELACOES INSTITUCIONAIS">RELAÇÕES INSTITUCIONAIS</option>
                <option value="REMINERALIZADOR">REMINERALIZADOR</option>
                <option value="PSA GESTAGUA">PSA GESTÁGUA</option>
                <option value="PPC">PPC</option> 
              </select>
            </div>
          </div>

          <!-- Observações -->
          <div class="form-group">
            <label class="form-label">Observações (Opcional)</label>
            <textarea id="res-obs" rows="2" placeholder="Ex: Viagem para Anutiba..." class="form-control"></textarea>
          </div>

          <!-- Botão Salvar -->
          <button type="submit" id="btn-submit" class="btn-primary">
            <i class="ph-bold ph-check"></i>
            <span>Confirmar Agendamento</span>
          </button>
        </form>
      </div>
    </section>

    <!-- ========================================== -->
    <!-- ABA 2: CALENDÁRIO & PRÓXIMOS AGENDAMENTOS  -->
    <!-- ========================================== -->
    <section id="view-calendario" class="hidden space-y-4">
      
      <!-- Card do Calendário -->
      <div class="card-panel p-3">
        <div id="calendar" class="min-h-[340px]"></div>
      </div>

      <!-- Lista de Agendamentos Ativos -->
      <div class="space-y-2.5">
        <div class="flex items-center justify-between px-1">
          <h2 class="form-label mb-0">Próximos Agendamentos</h2>
          <span id="badge-total-reservas" class="badge-pill">0 reservas</span>
        </div>

        <div id="lista-reservas" class="space-y-2.5">
          <!-- Renderizado via JavaScript -->
        </div>
      </div>

    </section>

  </main>

  <!-- Barra de Navegação Inferior (Estrutura idêntica à de Abastecimento) -->
  <nav class="mobile-bottom-nav">
    <a href="mobile.html" class="mobile-nav-item mobile-nav-item-inactive">
      <i class="ph-bold ph-key text-xl"></i>
      <span class="text-[10px]">Iniciar</span>
    </a>

    <a href="mobile.html" class="mobile-nav-item mobile-nav-item-inactive">
      <i class="ph-bold ph-map-pin-line text-xl"></i>
      <span class="text-[10px]">Finalizar</span>
    </a>

    <a href="mobile.html" class="mobile-nav-item mobile-nav-item-inactive">
      <i class="ph-bold ph-clock-counter-clockwise text-xl"></i>
      <span class="text-[10px]">Rotas</span>
    </a>

    <a href="reservasmobile.html" id="nav-btn-reservas" class="mobile-nav-item mobile-nav-item-inactive">
      <i class="ph-bold ph-calendar-check text-xl"></i>
      <span class="text-[10px]">Reservas</span>
    </a>

    <a href="abastecimentomobile.html" id="nav-btn-abastecimento" class="mobile-nav-item mobile-nav-item-inactive">
      <i class="ph-bold ph-gas-pump text-xl"></i>
      <span class="text-[10px]">Abastecer</span>
    </a>
  </nav>

  <!-- Script Externo -->
  <script src="../backendmobile/reservasmobile.js"></script>
</body>
</html>
