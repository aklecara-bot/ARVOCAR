<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ARVOCAR - Mobile Rotas</title>

  <!-- PWA & Manifesto (Caminhos absolutos a partir da raiz) -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#14532d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ARVO Rota" />
  
  <link rel="icon" type="image/png" sizes="192x192" href="/imagens/logo3d192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/imagens/logo3d192.png" />
  <link rel="stylesheet" href="/EsTyle/style.css">

  <!-- Registro do Service Worker pela raiz -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => console.log('PWA Service Worker Ativo:', reg.scope))
        .catch((err) => console.warn('Falha ao registrar SW:', err));
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
    }

    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 1rem);
    }
  </style>
</head>

<body
  class="bg-slate-900 text-slate-800 font-sans min-h-screen flex flex-col justify-between antialiased selection:bg-brand-500 selection:text-white">

  <!-- Tela de Login -->
  <div id="screen-login" class="flex-1 flex flex-col justify-center px-4 py-8 max-w-md mx-auto w-full">
    <div class="card-panel shadow-2xl relative overflow-hidden">


      <div class="text-center mb-6">
        <div class="card-icon-box mx-auto mb-2" style="width: 3.5rem; height: 3.5rem;">
          <img src="/imagens/arvocarblack150.png" alt="ARVOCAR" class="h-10 w-auto"
            onerror="this.style.display='none'; document.getElementById('login-fallback-icon').classList.remove('hidden');" />
          <i id="login-fallback-icon" class="ph-bold ph-steering-wheel text-3xl text-brand-700 hidden"></i>
        </div>
        <h1 class="card-title text-xl">ARVOCAR Mobile</h1>
        <p class="card-subtitle text-xs uppercase font-bold text-brand-700">Controle de Rotas</p>
      </div>

      <div id="m-login-erro" class="hidden mb-4 p-3 bg-rose-50 border border-rose-100 rounded-xl text-xs text-rose-700 flex items-start gap-2">
        <i class="ph-bold ph-warning-circle text-base shrink-0 mt-0.5"></i>
        <span id="m-login-erro-msg">E-mail ou senha inválidos.</span>
      </div>

      <form id="formMobileLogin" onsubmit="handleMobileLogin(event)" class="space-y-4">
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <div class="relative">
            <input type="email" id="m-email" required autocomplete="email" autocapitalize="none"
              placeholder="motorista@arvo.tec.br" class="form-control" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Senha</label>
          <div class="relative">
            <input type="password" id="m-senha" required placeholder="••••••••" class="form-control pr-10" />
            <button type="button" onclick="toggleSenhaMobile()" class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-600 focus:outline-none">
              <i id="m-icone-senha" class="ph-bold ph-eye text-base"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-m-login" class="btn-primary">
          <span>Entrar no Sistema</span>
          <i class="ph-bold ph-arrow-right text-base"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- Tela Principal do App -->
  <div id="screen-app" class="hidden flex-1 flex flex-col bg-slate-100 min-h-screen">

    <header class="app-header">
      <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
          <div class="brand-badge-logo" style="width: 2rem; height: 2rem; padding: 0.25rem;">
            <i class="ph-bold ph-steering-wheel text-lg"></i>
          </div>
          <div>
            <h1 class="brand-title text-sm">ARVOCAR</h1>
            <span id="m-top-username" class="text-[10px] text-brand-100 font-semibold block leading-tight truncate max-w-[170px]">Condutor</span>
          </div>
        </div>

        <button onclick="handleMobileLogout()" title="Sair" class="btn-logout">
          <i class="ph-bold ph-sign-out text-sm"></i>
          <span>Sair</span>
        </button>
      </div>
    </header>

    <main class="mobile-content">

      <!-- Aba 1: Iniciar Rota -->
      <section id="tab-iniciar" class="space-y-4">
        <div class="card-panel">
          <div class="card-header-bar">
            <div class="card-icon-box">
              <i class="ph-bold ph-key text-xl"></i>
            </div>
            <div>
              <h2 class="card-title text-sm">Iniciar Rota (Retirada)</h2>
              <p class="card-subtitle">Rotas com limite operacional de 12 horas</p>
            </div>
          </div>

          <form id="formMobileInicio" onsubmit="handleMobileInicioRota(event)" class="space-y-3.5">
            <div class="form-group">
              <label class="form-label">Selecione o Veículo Disponível *</label>
              <select id="m-inicio-veiculo" onchange="atualizarKmVeiculoMobile()" required
                class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl px-3 py-2.5 text-xs focus:ring-2 focus:ring-brand-500 font-bold outline-none">
                <option value="">Selecione o veículo...</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="form-label">KM Inicial</label>
                <input type="number" id="m-inicio-km" readonly
                  class="w-full bg-slate-100 border border-slate-200 text-slate-700 font-mono font-bold rounded-xl px-3 py-2 text-xs outline-none" />
              </div>
              <div>
                <label class="form-label">Origem da Saída *</label>
                <select id="m-inicio-origem" onchange="toggleOutroOrigemMobile(this.value)" required class="form-control">
                  <option value="ALEGRE">ALEGRE</option>
                  <option value="GUAÇUÍ">GUAÇUÍ</option>
                  <option value="CASTELO">CASTELO</option>
                  <option value="CELINA">CELINA</option>
                  <option value="CACHOEIRO">CACHOEIRO</option>
                  <option value="OUTRO">OUTRO (Digitar...)</option>
                </select>
              </div>
            </div>

            <input type="text" id="m-inicio-origem-outro" placeholder="Digite o local de saída..."
              class="form-control hidden uppercase" />

            <div class="form-group">
              <label class="form-label">Finalidade / Projeto *</label>
              <select id="m-inicio-finalidade" required class="form-control">
                <option value="">...</option>          
                <option value="CO INVESTIMENTO WWF">CO INVESTIMENTO WWF</option>
                <option value="DEMANDAS INTERNAS">DEMANDAS INTERNAS</option>
                <option value="DEMANDAS EXTERNAS">DEMANDAS EXTERNAS</option>
                <option value="IMPLANTACAO DE AREAS">IMPLANTAÇÃO DE ÁREAS</option>
                <option value="REFLORESTAR">REFLORESTAR</option>
                <option value="RELACOES INSTITUCIONAIS">RELAÇÕES INSTITUCIONAIS</option>
                <option value="REMINERALIZADOR">REMINERALIZADOR</option>
                <option value="PSA GESTAGUA">PSA GESTÁGUA</option>
                <option value="PPC">PPC</option> 
              </select>
            </div>

            <button type="submit" id="btn-m-confirmar-inicio" class="btn-primary">
              <i class="ph-bold ph-check-circle text-base"></i>
              <span>Confirmar Saída</span>
            </button>
          </form>
        </div>
      </section>

      <!-- Aba 2: Finalizar Rota -->
      <section id="tab-finalizar" class="hidden space-y-4">
        <div class="card-panel">
          <div class="card-header-bar">
            <div class="card-icon-box" style="background-color: #fef3c7; color: #b45309;">
              <i class="ph-bold ph-map-pin-line text-xl"></i>
            </div>
            <div>
              <h2 class="card-title text-sm">Finalizar Rota</h2>
              <p class="card-subtitle">Devolução, apuração de KM e avarias</p>
            </div>
          </div>

          <form id="formMobileFim" onsubmit="handleMobileFimRota(event)" class="space-y-3.5">
            <div class="form-group">
              <label class="form-label">Selecionar Rota Ativa *</label>
              <select id="m-fim-rota-select" onchange="selecionarRotaFimMobile()" required class="form-control font-bold">
                <option value="">Selecione sua rota ativa...</option>
              </select>
            </div>

            <div id="m-detalhes-viagem" class="info-summary-box hidden">
              <div class="info-summary-row"><span>Veículo:</span> <b id="m-info-veiculo">-</b></div>
              <div class="info-summary-row"><span>KM Saída:</span> <b id="m-info-kmsaida" class="font-mono">-</b></div>
              <div class="info-summary-row"><span>Distância:</span> <b id="m-info-percorrido" class="font-mono">-</b></div>
            </div>

            <div class="form-grid-2 form-group">
              <div>
                <label class="form-label">KM Final *</label>
                <input type="number" id="m-fim-km" oninput="calcularKmPercorridoMobile()" required placeholder="Ex: 77250" class="form-control font-mono font-bold" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Local de Entrega *</label>
                <select id="m-fim-destino" onchange="toggleOutroDestinoMobile(this.value)" required
                  class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                  <option value="ALEGRE">ALEGRE</option>
                  <option value="GUAÇUÍ">GUAÇUÍ</option>
                  <option value="CASTELO">CASTELO</option>
                  <option value="CELINA">CELINA</option>
                  <option value="CACHOEIRO">CACHOEIRO</option>
                  <option value="OUTRO">OUTRO (Digitar...)</option>
                </select>
              </div>
            </div>

            <input type="text" id="m-fim-destino-outro" placeholder="Digite o local de devolução..." class="form-control hidden uppercase" />

            <div id="m-km-feedback" class="text-[11px] font-medium"></div>

            <div class="pt-2 border-t border-slate-100">
              <label class="form-label">Situação do Carro</label>
              <div class="flex items-center gap-4 text-xs font-semibold mb-2">
                <label class="flex items-center gap-1.5 cursor-pointer">
                  <input type="radio" name="m_situacao_carro" value="SEM" checked onchange="toggleAnomaliaMobile(false)"
                    class="text-brand-600 focus:ring-0" />
                  <span class="text-emerald-700">Sem Problemas</span>
                </label>
                <label class="flex items-center gap-1.5 cursor-pointer">
                  <input type="radio" name="m_situacao_carro" value="COM" onchange="toggleAnomaliaMobile(true)"
                    class="text-rose-600 focus:ring-0" />
                  <span class="text-rose-700">Com Avarias / Ruídos</span>
                </label>
              </div>
              <textarea id="m-fim-anomalia" rows="2" placeholder="Descreva o problema observado..." class="form-control form-textarea textarea-anomalia hidden"></textarea>
            </div>

            <button type="submit" id="btn-m-confirmar-fim" class="btn-primary btn-mobile-warning">
              <i class="ph-bold ph-check text-base"></i><span>Finalizar Rota</span>
            </button>
          </form>
        </div>
      </section>

      <!-- Aba 3: Histórico -->
      <section id="tab-historico" class="hidden space-y-3">
        <div class="flex items-center justify-between px-1">
          <h2 class="form-label mb-0">Meu Histórico de Rotas</h2>
          <span id="m-total-rotas-badge" class="badge-pill">0 rotas</span>
        </div>
        <div id="m-lista-historico" class="space-y-2.5"></div>
      </section>

    </main>

    <!-- Barra de Navegação Inferior -->
    <nav class="mobile-bottom-nav">    
      <button onclick="switchMobileTab('iniciar')" id="nav-btn-iniciar" class="mobile-nav-item mobile-nav-item-inactive">
        <i class="ph-bold ph-key text-xl"></i>
        <span class="text-[10px]">Iniciar</span>
      </button>

      <button onclick="switchMobileTab('finalizar')" id="nav-btn-finalizar" class="mobile-nav-item mobile-nav-item-inactive">
        <i class="ph-bold ph-map-pin-line text-xl"></i>
        <span class="text-[10px]">Finalizar</span>
      </button>

      <button onclick="switchMobileTab('historico')" id="nav-btn-historico" class="mobile-nav-item mobile-nav-item-inactive">
        <i class="ph-bold ph-clock-counter-clockwise text-xl"></i>
        <span class="text-[10px]">Rotas</span>
      </button>

      <a href="reservasmobile.html" id="nav-btn-reservas" class="mobile-nav-item mobile-nav-item-inactive">
        <i class="ph-bold ph-calendar-check text-xl"></i>
        <span class="text-[10px]">Reservas</span>
      </a>

      <a href="abastecimentomobile.html" id="nav-btn-abastecimento" class="mobile-nav-item mobile-nav-item-inactive">
        <i class="ph-bold ph-gas-pump text-xl"></i>
        <span class="text-[10px]">Abastecer</span>
      </a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Use o caminho relativo para funcionar em qualquer porta/servidor -->
  <script src="../backendmobile/mobile.js"></script>
</body>

</html>
