<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARVOCAR - Agendamento e Reserva de Veículos</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
  <style>
    .fc .fc-toolbar-title { font-size: 1rem; font-weight: 800; color: #0f172a; }
    .fc .fc-button-primary { background-color: #15803d; border-color: #15803d; font-size: 0.75rem; font-weight: 700; border-radius: 0.5rem; }
    .fc .fc-button-primary:hover { background-color: #166534; border-color: #166534; }
    .fc .fc-button-primary:disabled { background-color: #94a3b8; border-color: #94a3b8; }
    .fc-event { border-radius: 0.375rem; padding: 2px 4px; font-size: 0.75rem; font-weight: 600; cursor: pointer; border: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="bg-brand-900 text-white shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-brand-600 p-2 rounded-xl flex items-center justify-center text-white shadow">
          <img src="/imagens/arvocarwhite30.png" alt="">
        </div>
        <div>
          <span class="text-xl font-black tracking-tight">ARVOCAR</span>
          <span class="text-brand-300 text-xs font-semibold uppercase tracking-wider block sm:inline sm:ml-2">Agenda de Veículos</span>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <a href="paginainicial.html" class="flex items-center gap-1.5 text-xs bg-brand-800 hover:bg-brand-700 text-white px-3.5 py-2 rounded-xl border border-brand-700 transition font-bold shadow-sm">
          <i class="ph-bold ph-arrow-left text-base"></i>
          <span>Voltar ao Painel</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- Formulário de Agendamento (Coluna da Esquerda) -->
      <div class="lg:col-span-4 bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
        <div class="pb-3 border-b border-slate-100 flex items-center gap-2.5">
          <div class="p-2 bg-brand-50 text-brand-700 rounded-lg">
            <i class="ph-bold ph-calendar-plus text-xl"></i>
          </div>
          <div>
            <h2 class="text-sm font-bold text-slate-900">Agendar Veículo</h2>
            <p class="text-[11px] text-slate-400">Reserve com antecedência</p>
          </div>
        </div>

        <form id="formReserva" onsubmit="handleSalvarReserva(event)" class="space-y-3.5 text-xs">
          <div>
            <label class="block font-bold text-slate-700 uppercase mb-1">Veículo</label>
            <select id="res-veiculo" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl px-3 py-2.5 font-bold focus:ring-2 focus:ring-brand-500">
              <option value="">Carregando veículos...</option>
            </select>
          </div>

          <div>
            <label class="block font-bold text-slate-700 uppercase mb-1">Modalidade da Reserva</label>
            <select id="res-tipo" onchange="ajustarCamposModalidade(this.value)" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl px-3 py-2.5 font-semibold focus:ring-2 focus:ring-brand-500">
              <option value="HORAS">Por Horas (Mesmo dia)</option>
              <option value="TURNO">Por Turno (Manhã, Tarde ou Noite)</option>
              <option value="DIAS" selected>Por Dia / Dias</option>
              <option value="SEMANAS">Por Semana(s)</option>
              <option value="MES">Por Mês</option>
            </select>
          </div>

          <!-- Campos de Horário para "HORAS" -->
          <div id="box-horas" class="hidden grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold text-slate-600 mb-1">Hora Início</label>
              <input type="time" id="res-hora-inicio" value="08:00" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-2 font-mono" />
            </div>
            <div>
              <label class="block font-bold text-slate-600 mb-1">Hora Fim</label>
              <input type="time" id="res-hora-fim" value="12:00" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-2 font-mono" />
            </div>
          </div>

          <!-- Seleção para "TURNO" -->
          <div id="box-turno" class="hidden">
            <label class="block font-bold text-slate-600 mb-1">Turno Desejado</label>
            <select id="res-turno-sel" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2">
              <option value="MANHA">Manhã (07:00 às 12:00)</option>
              <option value="TARDE">Tarde (13:00 às 18:00)</option>
              <option value="NOITE">Noite / Integral (18:00 às 06:00)</option>
            </select>
          </div>

          <!-- Datas -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold text-slate-700 uppercase mb-1">Data Início</label>
              <input type="date" id="res-data-inicio" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl px-2.5 py-2 font-medium focus:ring-2 focus:ring-brand-500" />
            </div>
            <div id="box-data-fim">
              <label class="block font-bold text-slate-700 uppercase mb-1">Data Fim</label>
              <input type="date" id="res-data-fim" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl px-2.5 py-2 font-medium focus:ring-2 focus:ring-brand-500" />
            </div>
          </div>

          <div>
            <label class="block font-bold text-slate-700 uppercase mb-1">Finalidade / Projeto</label>
            <select id="res-finalidade" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl px-3 py-2 font-medium focus:ring-2 focus:ring-brand-500">
              <option value="RELACOES INSTITUCIONAIS">RELAÇÕES INSTITUCIONAIS</option>
                <option value="REFLORESTAR">REFLORESTAR</option>
                <option value="PSA GESTAGUA">PSA GESTÁGUA</option>
                <option value="PPC">PPC</option>
                <option value="CO INVESTIMENTO WWF">CO INVESTIMENTO WWF</option>
                <option value="REMINERALIZADOR">REMINERALIZADOR</option>
                <option value="DEMANDAS INTERNAS">DEMANDAS INTERNAS</option>
                <option value="DEMANDAS EXTERNAS">DEMANDAS EXTERNAS</option>
            </select>
          </div>

          <div>
            <label class="block font-bold text-slate-700 uppercase mb-1">Observações (Opcional)</label>
            <textarea id="res-obs" rows="2" placeholder="Ex: Viagem para Anutiba..." class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-brand-500"></textarea>
          </div>

          <button type="submit" id="btn-salvar-reserva" class="w-full bg-brand-700 hover:bg-brand-800 text-white font-bold py-3 px-4 rounded-xl shadow transition flex items-center justify-center gap-2 text-xs">
            <i class="ph-bold ph-check"></i> Confirmar Agendamento
          </button>
        </form>
      </div>

      <!-- Calendário e Tabela de Reservas (Coluna da Direita) -->
      <div class="lg:col-span-8 space-y-6">
        
        <!-- Calendário Interativo -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
          <div id="calendar"></div>
        </div>

        <!-- Lista de Reservas Ativas com Botão de Cancelar -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="p-4 border-b border-slate-100 flex justify-between items-center">
            <h3 class="text-sm font-bold text-slate-800">Próximos Agendamentos</h3>
            <span id="badge-total-reservas" class="text-xs bg-brand-50 text-brand-700 font-bold px-3 py-1 rounded-full border border-brand-200">0 reservas</span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-600">
              <thead class="bg-slate-50 border-b border-slate-200 font-bold text-slate-700 uppercase tracking-wider">
                <tr>
                  <th class="py-3 px-3">Veículo</th>
                  <th class="py-3 px-3">Condutor</th>
                  <th class="py-3 px-3">Período</th>
                  <th class="py-3 px-3">Finalidade</th>
                  <th class="py-3 px-3 text-center">Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaListaReservas" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>

      </div>

    </div>

  </main>

  <script src="/backend/appreserva.js">
   
  </script>
</body>
</html>
