<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARVOCAR - Reservas</title>

  <!-- Favicon / Manifest -->
  <link rel="icon" type="image/png" sizes="192x192" href="/imagens/logo3d192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/imagens/logo3d192.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Dependências Externas -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

  <!-- Estilo Centralizado -->
  <link rel="stylesheet" href="/EsTyle/style.css" />
</head>

<body>

  <!-- Cabeçalho Padrão -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-wrapper">
        <div class="brand-icon-box">
          <i class="ph-bold ph-steering-wheel text-xl"></i>
        </div>
        <div>
          <span class="brand-title">ARVOCAR</span>
          <span class="brand-subtitle">Reservas</span>
        </div>
      </div>

      <div class="header-nav-group">
        <a href="paginainicial.html" class="btn-header-action">
          <i class="ph-bold ph-arrow-left"></i>
          <span>Voltar ao Início</span>
        </a>
        <a href="abastecimento.html" class="btn-header-action btn-header-amber">
          <i class="ph-bold ph-gas-pump"></i>
          <span>Abastecimento</span>
        </a>
      </div>

      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <div class="user-meta-info">
          <p id="topUserDisplay" class="user-meta-name">Carregando...</p>
          <span id="topUserCnh" class="user-meta-cnh"></span>
        </div>
        <button onclick="fazerLogout()" title="Sair" class="btn-logout">
          <i class="ph-bold ph-sign-out"></i>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Área Principal -->
  <main class="main-content" style="max-width: 80rem; margin: 1.5rem auto;">
    <div class="reservas-grid">

      <!-- Coluna da Esquerda: Formulário de Agendamento -->
      <div class="reservas-col-form">
        <div class="card-panel">
          <div class="card-header-bar">
            <div class="card-icon-box">
              <i class="ph-bold ph-calendar-plus text-xl"></i>
            </div>
            <div>
              <h2 class="card-title">Agendar Veículo</h2>
              <p class="card-subtitle">Reserve com antecedência</p>
            </div>
          </div>

          <form id="formReserva" onsubmit="handleSalvarReserva(event)">
            
            <div class="form-group">
              <label class="form-label">Veículo</label>
              <select id="res-veiculo" required class="form-control">
                <option value="">Carregando veículos...</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Modalidade da Reserva</label>
              <select id="res-tipo" onchange="ajustarCamposModalidade(this.value)" required class="form-control">
                <option value="HORAS">Por Horas (Mesmo dia)</option>
                <option value="TURNO">Por Turno (Manhã, Tarde ou Noite)</option>
                <option value="DIAS" selected>Por Dia / Dias</option>
                <option value="SEMANAS">Por Semana(s)</option>
                <option value="MES">Por Mês</option>
              </select>
            </div>

            <!-- Horários para Horas -->
            <div id="box-horas" class="form-grid-2 form-group" style="display: none;">
              <div>
                <label class="form-label">Hora Início</label>
                <input type="time" id="res-hora-inicio" value="08:00" class="form-control" />
              </div>
              <div>
                <label class="form-label">Hora Fim</label>
                <input type="time" id="res-hora-fim" value="12:00" class="form-control" />
              </div>
            </div>

            <!-- Seleção de Turno -->
            <div id="box-turno" class="form-group" style="display: none;">
              <label class="form-label">Turno</label>
              <select id="res-turno-sel" class="form-control">
                <option value="MANHA">Manhã (07:00 às 12:00)</option>
                <option value="TARDE">Tarde (13:00 às 18:00)</option>
                <option value="NOITE">Noite / Pernoite (18:00 às 06:00)</option>
              </select>
            </div>

            <!-- Datas Início e Fim -->
            <div class="form-grid-2 form-group">
              <div>
                <label class="form-label">Data Início</label>
                <input type="date" id="res-data-inicio" required class="form-control" />
              </div>
              <div id="box-data-fim">
                <label class="form-label">Data Término</label>
                <input type="date" id="res-data-fim" required class="form-control" />
              </div>
            </div>

            <!-- Finalidade -->
            <div class="form-group">
              <label class="form-label">Finalidade</label>
              <select id="res-finalidade" required class="form-control">
                <option value="CO INVESTIMENTO WWF">CO INVESTIMENTO WWF</option>
                <option value="DEMANDAS INTERNAS" selected>DEMANDAS INTERNAS</option>
                <option value="DEMANDAS EXTERNAS">DEMANDAS EXTERNAS</option>
                <option value="IMPLANTACAO DE AREAS">IMPLANTAÇÃO DE ÁREAS</option>
                <option value="REFLORESTAR">REFLORESTAR</option>
                <option value="RELACOES INSTITUCIONAIS">RELAÇÕES INSTITUCIONAIS</option>
                <option value="REMINERALIZADOR">REMINERALIZADOR</option>
                <option value="PSA GESTAGUA">PSA GESTÁGUA</option>
                <option value="PPC">PPC</option>
              </select>
            </div>

            <!-- Observação -->
            <div class="form-group">
              <label class="form-label">Observações (Opcional)</label>
              <textarea id="res-obs" rows="2" placeholder="Ex: Viagem para Anutiba..." class="form-control form-textarea"></textarea>
            </div>

            <button type="submit" id="btn-salvar-reserva" class="btn-primary">
              <i class="ph-bold ph-check"></i>
              <span>Confirmar Agendamento</span>
            </button>
          </form>
        </div>
      </div>

      <!-- Coluna da Direita: Calendário e Tabela -->
      <div class="reservas-col-main" style="display: flex; flex-direction: column; gap: 1.5rem;">
        
        <!-- Calendário Interativo -->
        <div class="card-panel" style="padding: 1.25rem;">
          <div id="calendar"></div>
        </div>

        <!-- Tabela de Reservas -->
        <div class="card-panel" style="padding: 0; overflow: hidden;">
          <div style="padding: 1rem 1.25rem; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center;">
            <h3 class="card-title" style="font-size: 0.875rem;">Próximos Agendamentos</h3>
            <span id="badge-total-reservas" class="badge-pill">0 reservas</span>
          </div>
          
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Veículo</th>
                  <th>Condutor</th>
                  <th>Período</th>
                  <th>Finalidade</th>
                  <th style="text-align: center;">Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaListaReservas"></tbody>
            </table>
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- Modal de Detalhes da Reserva no Calendário -->
  <div id="modal-info-reserva" class="modal-backdrop" style="display: none;">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 0.75rem; margin-bottom: 1rem;">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <div class="card-icon-box">
            <i class="ph-bold ph-calendar-check text-xl"></i>
          </div>
          <div>
            <h3 id="res-modal-veiculo" class="card-title" style="font-size: 0.875rem;">ARVO</h3>
            <p class="card-subtitle">Reserva Confirmada</p>
          </div>
        </div>
        <button type="button" onclick="fecharModalInfoReserva()" class="btn-logout" style="background: transparent; border: none; color: #64748b;">
          <i class="ph-bold ph-x text-lg"></i>
        </button>
      </div>

      <div style="background-color: #f8fafc; border: 1px solid #f1f5f9; border-radius: 0.75rem; padding: 1rem; margin-bottom: 1rem; font-size: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem;">
        <div style="display: flex; justify-content: space-between;"><span style="color: #64748b;">Condutor:</span><b id="res-modal-condutor">-</b></div>
        <div style="display: flex; justify-content: space-between;"><span style="color: #64748b;">Finalidade:</span><span id="res-modal-finalidade" class="badge-pill">-</span></div>
        <div style="display: flex; justify-content: space-between; border-top: 1px solid #e2e8f0; padding-top: 0.5rem;"><span style="color: #64748b;">Início:</span><b id="res-modal-inicio">-</b></div>
        <div style="display: flex; justify-content: space-between;"><span style="color: #64748b;">Término:</span><b id="res-modal-fim">-</b></div>
      </div>

      <button type="button" onclick="fecharModalInfoReserva()" class="btn-primary" style="margin-top: 0;">
        Fechar
      </button>
    </div>
  </div>

  <script src="/backend/appreserva.js"></script>
</body>
</html>
