<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARVO - Gestão e Operação de Frota</title>

  <!-- Tailwind CSS & Ícones -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Arquivo de Estilos Centralizado -->
  <link rel="stylesheet" href="../EsTyle/style.css" />
</head>

<body class="app-body">

  <!-- Cabeçalho Principal -->
  <header class="app-header">
    <div class="header-inner">
      
      <!-- Marca e Título -->
      <div class="flex items-center space-x-3">
        <div class="brand-badge-logo">
          <img src="/imagens/arvocarwhite30.png" alt="ARVOCAR" />
        </div>
        <div class="flex items-baseline">
          <span class="brand-title">ARVOCAR</span>
          <span class="brand-subtitle">Controle de Rota</span>
        </div>
      </div>

      <!-- Módulos de Operação e Gestão -->
      <div class="header-modules-wrapper">
        <button id="btn-mod-operacao" onclick="setModule('operacao')" class="btn-module-nav module-nav-active">
          <i class="ph-bold ph-paper-plane-tilt"></i>
          <span>Rotas</span>
        </button>
        <button id="btn-mod-gestao" onclick="setModule('gestao')" class="btn-module-nav module-nav-inactive hidden">
          <i class="ph-bold ph-chart-pie-slice"></i>
          <span>Painel de Gestão</span>
        </button>
      </div>

      <!-- Links Rápidos e Botão de Logout -->
      <div class="flex items-center gap-2">
        <a href="reservas.html" class="btn-nav-action btn-nav-green">
          <i class="ph-bold ph-calendar-check text-base"></i>
          <span>Reservas</span>
        </a>

        <a href="abastecimento.html" class="btn-nav-action btn-nav-amber">
          <i class="ph-bold ph-gas-pump text-base"></i>
          <span>Abastecimento</span>
        </a>

        <div class="hidden sm:flex flex-col text-right ml-2 mr-1">
          <span id="header-user-nome" class="text-xs font-bold leading-tight text-white"></span>
          <span id="header-user-cnh" class="text-[10px] text-brand-200"></span>
        </div>

        <button onclick="handleLogout()" title="Sair" class="btn-logout">
          <i class="ph-bold ph-sign-out text-sm"></i>
          <span>Sair</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- Módulo de Operação -->
    <div id="module-operacao" class="space-y-6">

      <!-- Submenu / Abas de Rotas -->
      <div class="flex items-center justify-between border-b border-slate-200 pb-2 mb-4">
        <nav class="flex space-x-4">
          <button id="tab-btn-saida" onclick="setSubTab('operacao', 'saida')" class="pb-2 text-xs font-semibold text-slate-500 hover:text-slate-800 transition subtab-active">
            Iniciar Rota
          </button>
          <button id="tab-btn-retorno" onclick="setSubTab('operacao', 'retorno')" class="pb-2 text-xs font-semibold text-slate-500 hover:text-slate-800 transition">
            Finalizar Rota
          </button>
          <button id="tab-btn-minhas-rotas" onclick="setSubTab('operacao', 'minhas-rotas')" class="pb-2 text-xs font-semibold text-slate-500 hover:text-slate-800 transition">
            Minhas Rotas
          </button>
        </nav>
      </div>

      <!-- Iniciar Rota -->
      <section id="view-saida" class="max-w-2xl mx-auto">
        <div class="card-panel">
          <div class="card-header-bar">
            <div class="card-icon-box">
              <i class="ph-bold ph-key text-xl"></i>
            </div>
            <div>
              <h2 class="card-title">Iniciar Rota (Saída)</h2>
              <p class="card-subtitle">Selecione o veículo disponível e registre a origem</p>
            </div>
          </div>

          <form id="form-inicio-rota" onsubmit="handleInicioRota(event)" class="space-y-4">
            <div>
              <label class="form-label">Veículo Disponível</label>
              <select id="form-inicio-veiculo" onchange="handleVeiculoSelecionadoInicio()" required class="form-control">
                <option value="">Carregando veículos...</option>
              </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="form-label">KM Inicial (Bloqueado)</label>
                <div class="relative">
                  <input type="number" id="form-inicio-km" readonly class="form-control form-control-readonly" />
                  <span class="absolute right-3 top-2.5 text-xs text-slate-400 font-medium">km</span>
                </div>
                <span class="form-sublabel">Carregado da última devolução.</span>
              </div>

              <div>
                <label class="form-label">Origem da Saída</label>
                <select id="form-inicio-origem" required class="form-control">
                  <option value="ALEGRE">ALEGRE</option>
                  <option value="GUAÇUÍ">GUAÇUÍ</option>
                  <option value="CASTELO">CASTELO</option>
                  <option value="MUNIZ FREIRE">MUNIZ FREIRE</option>
                  <option value="LOCADORA CACHOEIRO">LOCADORA CACHOEIRO</option>
                  <option value="LOCADORA CASTELO">LOCADORA CASTELO</option>
                </select>
              </div>
            </div>

            <div>
              <label class="form-label">Finalidade / Projeto</label>
              <select id="form-inicio-finalidade" required class="form-control">
                <option value="">Selecione a finalidade...</option>
                <option value="CO INVESTIMENTO WWF">CO INVESTIMENTO WWF</option>
                <option value="DEMANDAS INTERNAS">DEMANDAS INTERNAS</option>
                <option value="DEMANDAS EXTERNAS">DEMANDAS EXTERNAS</option>
                <option value="IMPLANTACAO DE AREAS">IMPLANTAÇÃO DE ÁREAS</option>
                <option value="REFLORESTAR">REFLORESTAR</option>
                <option value="RELACOES INSTITUCIONAIS">RELAÇÕES INSTITUCIONAIS</option>
                <option value="REMINERALIZADOR">REMINERALIZADOR</option>
                <option value="PSA GESTAGUA">PSA GESTÁGUA</option>
                <option value="PPC">PPC</option>
              </select>
            </div>

            <div class="pt-4">
              <button id="btn-submit-inicio" type="submit" class="btn-primary">
                <i class="ph-bold ph-check-circle text-lg"></i>
                <span>Iniciar Rota</span>
              </button>
            </div>
          </form>
        </div>
      </section>

      <!-- Finalizar Rota -->
      <section id="view-retorno" class="hidden max-w-2xl mx-auto">
        <div class="card-panel">
          <div class="card-header-bar">
            <div class="card-icon-box bg-amber-100 text-amber-700">
              <i class="ph-bold ph-flag-checkered text-xl"></i>
            </div>
            <div>
              <h2 class="card-title">Finalizar Rota (Devolução)</h2>
              <p class="card-subtitle">Informe o local de devolução e odômetro final</p>
            </div>
          </div>

          <form id="form-fim-rota" onsubmit="handleFimRota(event)" class="space-y-4">
            <div>
              <label class="form-label">Sua Viagem em Andamento</label>
              <select id="form-fim-rota-select" required class="form-control">
                <option value="">Selecione uma rota ativa...</option>
              </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="form-label">KM Final no Painel</label>
                <input type="number" id="form-fim-km" required class="form-control" />
              </div>

              <div>
                <label class="form-label">Destino / Local de Devolução</label>
                <select id="form-fim-destino" required class="form-control">
                  <option value="ALEGRE">ALEGRE</option>
                  <option value="GUAÇUÍ">GUAÇUÍ</option>
                  <option value="CASTELO">CASTELO</option>
                  <option value="MUNIZ FREIRE">MUNIZ FREIRE</option>
                  <option value="LOCADORA CACHOEIRO">LOCADORA CACHOEIRO</option>
                </select>
              </div>
            </div>

            <div class="pt-4">
              <button id="btn-submit-fim" type="submit" class="btn-primary">
                <i class="ph-bold ph-check-circle text-lg"></i>
                <span>Finalizar Rota</span>
              </button>
            </div>
          </form>
        </div>
      </section>

    </div>
  </main>

  <!-- Script da Regra de Negócio Web -->
  <script src="../backend/app.js"></script>
</body>
</html>
