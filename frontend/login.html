<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARVO - Acesso ao Sistema de Rota</title>

  <link rel="icon" type="image/png" sizes="192x192" href="/imagens/logo3d192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/imagens/logo3d192.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/EsTyle/style.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
</head>

<body
  class="bg-slate-900 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-brand-500 selection:text-white">

  <!-- Card Principal de Login -->
  <div
    class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 sm:p-10 border border-slate-100 relative overflow-hidden">

    <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-brand-500 via-brand-600 to-emerald-400"></div>

    <div class="text-center mb-8">
      <div
        class="inline-flex items-center justify-center p-3.5 bg-brand-50 rounded-2xl text-brand-700 shadow-inner mb-3">
        <img src="/imagens/arvocarblack150.png" alt="arvocar">
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">ARVOCAR</h1>
      <p class="text-xs font-bold uppercase tracking-wider text-brand-700">Controle de Rota 2026</p>
      <p class="text-xs text-slate-400 mt-1">Insira as suas credenciais para acessar</p>
    </div>

    <!-- Mensagem de Erro -->
    <div id="erro-login"
      class="hidden mb-5 p-3.5 bg-rose-50 border border-rose-100 rounded-xl text-xs text-rose-700 flex items-start gap-2.5">
      <i class="ph-bold ph-warning-circle text-base shrink-0 mt-0.5"></i>
      <span id="erro-login-msg">E-mail ou senha inválidos.</span>
    </div>

    <!-- Formulário Oficial de Login -->
    <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">E-mail</label>
        <div class="relative">
          <span class="absolute left-3.5 top-3 text-slate-400">
            <i class="ph-bold ph-envelope-simple text-base"></i>
          </span>
          <input type="email" id="login-email" required placeholder="usuario@arvo.tec.br"
            class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl pl-10 pr-3.5 py-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 focus:bg-white outline-none transition" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-black uppercase text-slate-600 mb-1">Senha</label>
        <div class="relative">
          <input type="password" id="login-senha" required placeholder="••••••••"
            class="w-full bg-white border border-[#E2DDD5] text-slate-900 rounded-xl px-3.5 py-2.5 text-xs focus:ring-2 focus:ring-[#395237] font-semibold outline-none pr-10" />
          <button type="button" onclick="toggleSenhaMobile()" class="absolute right-3.5 top-2.5 text-slate-400 hover:text-slate-600">
            <i id="m-icone-senha" class="ph-bold ph-eye text-base"></i>
          </button>
        </div>
      </div>

      <!-- Botão Esqueceu a Senha -->
      <div class="flex justify-end pt-1">
        <button type="button" onclick="abrirModalEsqueciSenha()" class="text-[11px] font-bold text-[#395237] hover:underline">
          Esqueceu a senha?
        </button>
      </div>

      <div class="pt-2">
        <button type="submit" id="btn-login" class="btn-primary w-full py-3 bg-[#1E5E3A] hover:bg-[#164E2E] text-white font-bold rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-md">
          <span>Entrar no Sistema</span>
          <i class="ph-bold ph-arrow-right text-base"></i>
        </button>
      </div>
    </form>

    <div class="mt-8 pt-5 border-t border-slate-100 text-center">
      <span class="text-[11px] text-slate-400 block font-medium">Gestão e Operação de Veículos • ARVO</span>
    </div>

  </div>

  <!-- =========================================================================
  MODAIS DE RECUPERAÇÃO DE SENHA (E-MAIL + CNH)
  ========================================================================= -->
  <div id="modal-esqueci-senha" class="hidden fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-slate-100 text-slate-800">
         <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
           <h3 class="text-base font-black text-slate-900 flex items-center gap-2">
             <i class="ph-bold ph-key text-[#1E5E3A] text-lg"></i> Redefinir Senha
            </h3>
            <button type="button" onclick="fecharModalEsqueciSenha()" class="text-slate-400 hover:text-slate-600">
              <i class="ph-bold ph-x text-lg"></i>
            </button>
          </div>
          
          <p class="text-xs text-slate-500 mb-4">Confirme seu e-mail e os números da sua CNH cadastrada para criar uma nova senha.</p>
          
          <form onsubmit="handleRedefinicaoSimples(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase mb-1">E-mail Cadastrado</label>
              <input type="email" id="recup-email" required placeholder="seuemail@arvo.tec.br" 
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs outline-none focus:ring-2 focus:ring-emerald-600" />
            </div>
            
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Número da CNH (apenas números)</label>
              <input type="text" id="recup-cnh" required placeholder="Ex: 05598393715" maxlength="11"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs outline-none focus:ring-2 focus:ring-emerald-600" />
            </div>
            
            <div class="pt-1">
              <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nova Senha</label>
              <input type="password" id="recup-nova-senha" minlength="4" required placeholder="••••••••" 
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs outline-none focus:ring-2 focus:ring-emerald-600" />
            </div>
            
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Confirmar Nova Senha</label>
              <input type="password" id="recup-confirma-senha" minlength="4" required placeholder="••••••••" 
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs outline-none focus:ring-2 focus:ring-emerald-600" />
            </div>
            
            <div class="pt-2">
              <button type="submit" id="btn-redefinir-simples" class="w-full bg-[#1E5E3A] hover:bg-[#164E2E] text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition flex items-center justify-center gap-2">
                <span>Atualizar Minha Senha</span>
                <i class="ph-bold ph-check text-base"></i>
              </button>
            </div>
          </form>
        </div>
      </div>

  <!-- Modal 2: Inserir Código e Redefinir Senha -->
  <div id="modal-redefinir-senha" class="hidden fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-slate-100 text-slate-800">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
        <h3 class="text-base font-black text-slate-900 flex items-center gap-2">
          <i class="ph-bold ph-lock-key text-brand-600"></i> Nova Senha
        </h3>
        <button type="button" onclick="fecharModalRedefinirSenha()" class="text-slate-400 hover:text-slate-600">
          <i class="ph-bold ph-x text-lg"></i>
        </button>
      </div>
      
      <form onsubmit="handleConfirmarNovaSenha(event)" class="space-y-3.5">
        <input type="hidden" id="redef-email-alvo" />
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Código (6 dígitos)</label>
          <input type="text" id="redef-codigo" maxlength="6" required placeholder="123456" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-mono text-center tracking-widest outline-none focus:ring-2 focus:ring-brand-500" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nova Senha</label>
          <input type="password" id="redef-nova-senha" minlength="4" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs outline-none focus:ring-2 focus:ring-brand-500" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Confirmar Nova Senha</label>
          <input type="password" id="redef-confirma-senha" minlength="4" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs outline-none focus:ring-2 focus:ring-brand-500" />
        </div>
        <button type="submit" id="btn-redefinir" class="w-full bg-[#1E5E3A] hover:bg-[#164E2E] text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition">
          Atualizar Senha
        </button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    const SUPABASE_URL = "https://kadowettowccespuieyl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthZG93ZXR0b3djY2VzcHVpZXlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTc0NzYsImV4cCI6MjEwMzMzMzQ3Nn0.0gzxoaEZuorI1tZtUhJpyzWK48ENZP7LJZrqcXIlDQ0";

    // Número de WhatsApp da Base/Suporte da ARVO (com DDI 55 + DDD + Número)
    // Altere este número para o WhatsApp do Administrador ou Encarregado da Frota:
    const WHATSAPP_SUPORTE = "5528999839974"; 

   const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function toggleVerSenha() {
      const input = document.getElementById('login-senha');
      const icone = document.getElementById('icone-senha');
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        if (icone) {
          icone.classList.remove('ph-eye');
          icone.classList.add('ph-eye-slash');
        }
      } else {
        input.type = 'password';
        if (icone) {
          icone.classList.remove('ph-eye-slash');
          icone.classList.add('ph-eye');
        }
      }
    }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-login');
    const erroBox = document.getElementById('erro-login');
    const erroMsg = document.getElementById('erro-login-msg');

   const email = document.getElementById('login-email').value.trim().toLowerCase();
    const senha = document.getElementById('login-senha').value.trim();

    erroBox.classList.add('hidden');
    btn.disabled = true;
    btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin text-lg"></i> Autenticando...`;

    try {
    // 1. Autenticação nativa via Supabase Auth
    const { data: authData, error: authError } = await db.auth.signInWithPassword({
      email: email,
      password: senha
    });

    if (authError) throw authError;

    // 2. Procura os dados complementares do perfil (nome, CNH, perfil)
    const { data: perfilData, error: perfilError } = await db
      .from('usuarios')
      .select('id, nome, email, cnh, status, perfil')
      .eq('email', email)
      .maybeSingle();

    if (perfilError) throw perfilError;

    if (perfilData && perfilData.status && perfilData.status.toLowerCase() === 'inativo') {
      await db.auth.signOut();
      throw new Error("Este utilizador está inativo no momento.");
    }

    // 3. Monta o objeto de sessão unificado da aplicação
    const sessaoUsuario = {
      id: perfilData?.id || authData.user.id,
      auth_id: authData.user.id,
      nome: perfilData?.nome || email.split('@')[0],
      email: authData.user.email,
      cnh: perfilData?.cnh || '',
      perfil: perfilData?.perfil || 'motorista'
    };

    localStorage.setItem('arvo_usuario_logado', JSON.stringify(sessaoUsuario));
    localStorage.setItem('arvo_mobile_user', JSON.stringify(sessaoUsuario));

    window.location.href = "paginainicial.html";

  } catch (err) {
      console.error("Falha no login:", err);
      erroMsg.innerText = err.message || "E-mail ou palavra-passe inválidos.";
      erroBox.classList.remove('hidden');
    } finally {
    btn.disabled = false;
    btn.innerHTML = `<span>Entrar no Sistema</span> <i class="ph-bold ph-arrow-right text-base"></i>`;  }}

    // =========================================================================
    // LÓGICA DE RECUPERAÇÃO DE SENHA VIA WHATSAPP 1
    // =========================================================================

    function abrirModalEsqueciSenha() {
      document.getElementById('modal-esqueci-senha')?.classList.remove('hidden');
    }

    function fecharModalEsqueciSenha() {
      document.getElementById('modal-esqueci-senha')?.classList.add('hidden');
      document.getElementById('recup-email').value = '';
      document.getElementById('recup-cnh').value = '';
      document.getElementById('recup-nova-senha').value = '';
      document.getElementById('recup-confirma-senha').value = '';
    } 

    async function handleRedefinicaoSimples(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-redefinir-simples');
  const email = document.getElementById('recup-email').value.trim().toLowerCase();
  const cnhDigitada = document.getElementById('recup-cnh').value.replace(/\D/g, '').trim();
  const novaSenha = document.getElementById('recup-nova-senha').value.trim();
  const confirmaSenha = document.getElementById('recup-confirma-senha').value.trim();

  if (novaSenha.length < 4) {
    alert("⚠️ A nova senha deve ter no mínimo 4 caracteres.");
    return;
  }

  if (novaSenha !== confirmaSenha) {
    alert("⚠️ A confirmação da nova senha não confere.");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin text-base"></i> Verificando dados...`;

  try {
    // Valida E-mail + CNH e altera a senha diretamente no Supabase Authentication
    const { data, error } = await db.rpc('redefinir_senha_cnh', {
      p_email: email,
      p_cnh: cnhDigitada,
      p_nova_senha: novaSenha
    });

    if (error) throw error;

    if (!data || !data.success) {
      throw new Error(data?.message || "E-mail ou CNH não conferem com o cadastro.");
    }

    fecharModalEsqueciSenha();
    alert("✅ Senha atualizada com sucesso! Você já pode fazer login.");
  } catch (err) {
    alert("Erro: " + (err.message || "Falha ao atualizar a senha."));
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<span>Atualizar Minha Senha</span> <i class="ph-bold ph-check text-base"></i>`;
  }
}

    function fecharModalRedefinirSenha() {
      document.getElementById('modal-redefinir-senha')?.classList.add('hidden');
      document.getElementById('redef-codigo').value = '';
      document.getElementById('redef-nova-senha').value = '';
      document.getElementById('redef-confirma-senha').value = '';
    }

    // 1. Gera o código, salva no banco e redireciona para o WhatsApp
    

    async function fazerLogout() {
    await db.auth.signOut();
    localStorage.removeItem('arvo_usuario_logado');
    localStorage.removeItem('arvo_mobile_user');
    window.location.href = "login.html";
}

  </script>
</body>

</html>
