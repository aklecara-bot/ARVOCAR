<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ARVOCAR - Acesso ao Sistema</title>

  <!-- PWA & Manifesto -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#15803d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ARVO Rota" />

  <link rel="icon" type="image/png" sizes="192x192" href="/imagens/logo3d192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/imagens/logo3d192.png" />

  <!-- Bibliotecas Base -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Seus arquivos CSS com as classes criadas -->
  <link rel="stylesheet" href="../EsTyle/style.css" />
  <link rel="stylesheet" href="../style.css" />
</head>

<body class="login-body">

  <div id="screen-login" class="login-wrapper">
    <div class="login-card">
      <div class="login-top-gradient"></div>

      <div class="login-header">
        <div class="login-logo-badge">
          <img src="/imagens/arvocarblack150.png" alt="ARVOCAR"
          <i id="login-fallback-icon" class="ph-bold ph-steering-wheel hidden"></i>
        </div>
        <h1 class="login-title">ARVOCAR Mobile</h1>
        <p class="login-subtitle">Controle de Rotas</p>
      </div>

      <div id="erro-login-box" class="login-error-box" style="display: none;">
        <i class="ph-bold ph-warning-circle login-error-icon"></i>
        <span id="erro-login-msg">E-mail ou senha inválidos.</span>
      </div>

      <form id="formMobileLogin" onsubmit="executarLogin(event)" class="login-form">
        <div class="login-input-group">
          <label class="login-label">E-mail</label>
          <div class="login-input-wrapper">
            <span class="login-input-icon">
              <i class="ph-bold ph-envelope-simple"></i>
            </span>
            <input type="email" id="login-email" required autocomplete="email" autocapitalize="none"
              placeholder="motorista@arvo.tec.br" class="login-input" />
          </div>
        </div>

        <div class="login-input-group">
          <label class="login-label">Senha</label>
          <div class="login-input-wrapper">
            <span class="login-input-icon">
              <i class="ph-bold ph-lock-key"></i>
            </span>
            <input type="password" id="login-senha" required placeholder="••••••••"
              class="login-input login-input-password" />
            <button type="button" onclick="toggleSenhaVisivel()" class="login-btn-toggle-pass" title="Ver senha">
              <i id="icone-olho-senha" class="ph-bold ph-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-login" class="btn-login-submit">
          <span>Entrar no Sistema</span>
          <i class="ph-bold ph-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    // Inicialização do Supabase
    const SUPABASE_URL = "https://kadowettowccespuieyl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthZG93ZXR0b3djY2VzcHVpZXlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTc0NzYsImV4cCI6MjEwMzMzMzQ3Nn0.0gzxoaEZuorI1tZtUhJpyzWK48ENZP7LJZrqcXIlDQ0";
    const ADMIN_EMAIL = "admin@arvo.tec.br";
    const FIN_ADMIN_EMAIL = "admfin@arvo.tec.br";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false }
    });

    const validarNumeroCNH = (cnh) => /^\d{11}$/.test(String(cnh).replace(/\D/g, '')) && !/^(\d)\1{10}$/.test(String(cnh).replace(/\D/g, ''));

    function toggleSenhaVisivel() {
      const input = document.getElementById('login-senha');
      const icone = document.getElementById('icone-olho-senha');
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        if (icone) icone.className = 'ph-bold ph-eye-slash';
      } else {
        input.type = 'password';
        if (icone) icone.className = 'ph-bold ph-eye';
      }
    }

    async function executarLogin(e) {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();

      // Busca pelos campos por múltiplos IDs para garantir compatibilidade
      const emailInput = document.getElementById('login-email') || document.getElementById('m-email');
      const senhaInput = document.getElementById('login-senha') || document.getElementById('m-senha');
      const btn = document.getElementById('btn-login') || document.getElementById('btn-m-login');
      const erroBox = document.getElementById('erro-login-box') || document.getElementById('erro-login');
      const erroMsg = document.getElementById('erro-login-msg');

      const email = (emailInput?.value || '').trim().toLowerCase();
      const senha = (senhaInput?.value || '').trim();

      if (erroBox) erroBox.style.display = 'none';

      if (!email || !senha) {
        if (erroMsg) erroMsg.innerText = "Preencha o e-mail e a senha.";
        if (erroBox) erroBox.style.display = 'flex';
        return;
      }

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span>Autenticando...</span>`;
      }

      try {
        const { data, error } = await db
          .from('usuarios')
          .select('*')
          .eq('email', email)
          .maybeSingle();

        if (error) throw new Error("Erro de conexão com o banco de dados.");
        if (!data) throw new Error("E-mail não cadastrado.");
        if (String(data.senha).trim() !== senha) throw new Error("Senha incorreta.");
        if (data.status && data.status.toLowerCase() === 'inativo') {
          throw new Error("Usuário inativo no sistema.");
        }

        const ehAdmin = email === ADMIN_EMAIL.toLowerCase() || email === FIN_ADMIN_EMAIL.toLowerCase();
        if (!ehAdmin && !validarNumeroCNH(data.cnh)) {
          throw new Error("⛔ Acesso bloqueado: CNH não cadastrada ou inválida.");
        }

        const sessaoUsuario = {
          id: data.id,
          nome: data.nome || email.split('@')[0],
          email: data.email,
          cnh: data.cnh || '',
          perfil: data.perfil || 'motorista'
        };

        localStorage.setItem('arvo_usuario_logado', JSON.stringify(sessaoUsuario));
        localStorage.setItem('arvo_mobile_user', JSON.stringify(sessaoUsuario));

        // Redireciona para a página principal
        window.location.href = "paginainicial.html";

      } catch (err) {
        console.error("Falha no login:", err);
        if (erroMsg) erroMsg.innerText = err.message || "E-mail ou senha inválidos.";
        if (erroBox) erroBox.style.display = 'flex';
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>Entrar no Sistema</span> <i class="ph-bold ph-arrow-right"></i>`;
        }
      }
    }

    // Vincula globalmente para funcionar tanto via form onsubmit quanto button onclick
    window.handleMobileLogin = executarLogin;
    window.handleLogin = executarLogin;
    window.toggleSenhaMobile = toggleSenhaVisivel;
  </script>
</body>

</html>
